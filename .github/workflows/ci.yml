name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check index.html
        run: test -f index.html

      - name: Check CSS
        run: test -f css/style.css

      - name: Check JavaScript
        run: test -f js/main.js

      - name: CI Success
        run: echo "CI pipeline completed successfully!"